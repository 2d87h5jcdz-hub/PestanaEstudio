name: Página (GitHub Pages)

# Publica a página de divulgação (pasta site/) quando ela muda no main.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/prints/**'
      - 'docs/pix-qrcode.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # publicar no GitHub Pages
      id-token: write   # exigido pelo deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Montar a página
        run: |
          mkdir -p _site/prints
          cp site/index.html _site/
          cp docs/prints/*.jpg _site/prints/
          cp docs/pix-qrcode.png _site/
          cp Afinador/Assets.xcassets/AppIcon.appiconset/icon-1024.png _site/icon.png
          touch _site/.nojekyll

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5