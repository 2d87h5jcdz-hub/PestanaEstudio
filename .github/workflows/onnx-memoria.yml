name: Memória do modelo ONNX (diagnóstico)

on:
  push:
    branches: [android]
    paths:
      - scripts/onnx_memory_report.py
      - scripts/onnx_memory_trace.py
      - scripts/onnx_memory_configs.py
      - .github/workflows/onnx-memoria.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install numpy==1.26.4 onnx==1.17.0 onnxruntime==1.20.1
      - name: Baixar modelo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download demucs-model -p 'HTDemucs-v2.onnx' -D /tmp
      - name: Relatório
        run: |
          python scripts/onnx_memory_configs.py /tmp/HTDemucs-v2.onnx 2>&1 | tee report.txt
          sed -e 's/%/%25/g' report.txt | awk 'BEGIN{ORS="%0A"} {print}' | head -c 60000 > enc.txt
          echo "::notice title=Relatório::$(cat enc.txt)"
